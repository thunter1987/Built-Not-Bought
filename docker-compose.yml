services:
  db:
    image: postgres:17-alpine
    container_name: built-not-bought-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bnb_user
      POSTGRES_PASSWORD: bnb_password
      POSTGRES_DB: built_not_bought
    ports:
      - "5433:5432"
    volumes:
      - bnb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnb_user -d built_not_bought"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bnb_postgres_data: